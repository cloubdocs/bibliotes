<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Letra W - Bibliotes</title>
<style>
  body{font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#6b7c93; margin:0; padding:20px;}
  .contenedor{max-width:1100px; margin:0 auto; background:#f9fafb; border-radius:16px; padding:28px; box-shadow:0 10px 25px rgba(0,0,0,.15);}
  h1{text-align:center; font-size:1.6rem; margin-bottom:24px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
  .libro{background:white; border-radius:12px; padding:14px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-weight:600; font-size:0.95rem; line-height:1.3;}
  .libro .autor,.autor{display:block; font-size:0.88rem; font-weight:400; color:#6b7280; margin-top:4px; line-height:1.2;}
</style>
</head>
<body>
<div class="contenedor">
  <h1>Catálogo de libros con W (6)</h1>
  <div class="grid">
    <div class="libro">Walden, la vida en los bosques<span class="autor">Henry David Thoreau</span></div>
    <div class="libro">Waterloo<span class="autor">Bernard Cornwell</span></div>
    <div class="libro">Waylander<span class="autor">David Gemmell</span></div>
    <div class="libro">Wendigo<span class="autor">Bill Bridges</span></div>
    <div class="libro">Wolfsong, la canción del lobo<span class="autor">T. J. Klune</span></div>
    <div class="libro">Woodstock<span class="autor">Walter Scott</span></div>
  </div>
</div>
</body>
</html>

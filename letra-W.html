<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letra W - Bibliotes</title>
  <style>
    :root { --bg-body-dark: #5c768d; --header-light: #a0bccc; --salvador-blue: #0047AB; --bone-white: #f7f4ef; --border-color: #cbd5e1; }
    *{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg-body-dark);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100vh}
    header{background:var(--header-light);text-align:center;padding:1.5rem;border-top:4px solid var(--salvador-blue)}
    .logo{font-family:"Times New Roman",Times,serif;font-size:3.5rem;color:#000;text-decoration:none} .logo .digital-es{font-family:Arial,sans-serif;font-weight:900;color:#fff;background:var(--salvador-blue);padding:0 10px;border-radius:6px;display:inline-block;margin-left:2px;transform:translateY(-3px)}
    nav{background:#fff;display:flex;justify-content:center;gap:1.2rem;padding:.85rem 1rem;border-bottom:1px solid var(--border-color)} nav a,nav span{color:#334155;text-decoration:none;font-size:.9rem;font-weight:600}
    main{max-width:1100px;width:100%;margin:2rem auto;padding:0 1rem;flex:1}
    .alphabet-section{background:#F8FAFC;border-radius:12px;padding:3rem 2rem;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center}
    .alphabet-title{font-family:"Times New Roman",Times,serif;font-weight:bold;font-size:1.8rem;color:#0f172a;margin-bottom:1rem}
    .book-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;text-align:left}
    .book-card{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);color:#0f172a;padding:1rem;text-decoration:none;font-weight:700;transition:.2s;display:block}
    .book-card:hover{transform:scale(1.05);box-shadow:0 8px 16px rgba(0,0,0,.15)}
    footer{background:var(--bone-white);text-align:center;padding:1.5rem;color:#64748b;margin-top:auto;border-top:1px solid var(--border-color)}
  
   .libro.autor,.autor {
      display:block;
      font-size:0.88rem;
      font-weight:400;
      color:#6b7280;
      margin-top:4px;
      line-height:1.2;
    }
    
</style>
</head>
<body>
<header><a href="/bibliotes/" class="logo">Bibliot<span class="digital-es">es</span></a></header>
<nav><a href="/bibliotes/">Inicio</a><a href="/bibliotes/biblioteca.html">Biblioteca</a><span>Letra W</span></nav>
<main>
<section class="alphabet-section">
<h2 class="alphabet-title" id="titulo-catalogo">Catálogo de libros con W</h2>
<div class="book-grid" id="grid-W">
<a class="book-card" href="/bibliotes/alfabeto/W/walden-vida-bosques/">Walden, la vida en los bosques<span class="autor">Henry David Thoreau</span></a>
<a class="book-card" href="/bibliotes/alfabeto/W/waterloo/">Waterloo<span class="autor">Bernard Cornwell</span></a>
<a class="book-card" href="/bibliotes/alfabeto/W/waylander/">Waylander<span class="autor">David Gemmell</span></a>
<a class="book-card" href="/bibliotes/alfabeto/W/wendigo/">Wendigo<span class="autor">Bill Bridges</span></a>
<a class="book-card" href="/bibliotes/alfabeto/W/wolfsong-cancion-lobo/">Wolfsong, la canción del lobo<span class="autor">T. J. Klune</span></a>
<a class="book-card" href="/bibliotes/alfabeto/W/woodstock/">Woodstock<span class="autor">Walter Scott</span></a>
</div>
</section>
</main>
<footer><p>&copy; 2026 Bibliotes</p></footer>
<script>
// ESTA ES LA FUNCION AUTOMATICA
document.addEventListener('DOMContentLoaded', function(){
  const total = document.querySelectorAll('.book-card').length;
  const titulo = document.getElementById('titulo-catalogo');
  titulo.textContent = `Catálogo de libros con W (${total})`;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/bibliotes/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apoya el Proyecto - Bibliotes</title>
  <style>
    :root { --bg-body-dark: #5c768d; --header-light: #a0bccc; --salvador-blue: #0047AB; --salvador-blue-hover: #003380; --bone-white: #f7f4ef; --text-main: #1e293b; --border-color: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-body-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: var(--header-light); display: flex; flex-direction: column; width: 100%; border-top: 4px solid var(--salvador-blue); }
    .header-content { padding: 2rem 1rem; text-align: center; }
    .logo { font-family: "Times New Roman", Times, serif; font-size: 3.5rem; font-weight: normal; color: #000; text-decoration: none; letter-spacing: -1px; }
    .logo .digital-es { font-family: Arial, Helvetica, sans-serif; font-weight: 900; color: #fff; background-color: var(--salvador-blue); padding: 0 10px; border-radius: 6px; display: inline-block; letter-spacing: 0; margin-left: 2px; transform: translateY(-3px); }
    .subtitle { font-family: "Times New Roman", Times, serif; font-size: 1.2rem; color: #000; margin-top: 0.5rem; }
    nav { background: var(--bone-white); display: flex; justify-content: center; gap: 1.2rem; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
    nav a { color: #334155; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    nav a:hover { color: var(--salvador-blue); }
    main { max-width: 700px; width: 100%; margin: 2rem auto; padding: 0 1rem; flex: 1; }
    .donation-card { background: var(--bone-white); border: 1px solid var(--border-color); border-radius: 8px; padding: 2rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: var(--salvador-blue); font-family: "Times New Roman", Times, serif; font-size: 2rem; margin-bottom: 1rem; }
    .donation-card p { color: #475569; margin-bottom: 1.5rem; }
    .donate-button { display: inline-block; background: var(--salvador-blue); color: #fff; border-radius: 8px; padding: 1rem 2rem; font-weight: 800; text-decoration: none; transition: background-color 0.2s, transform 0.2s; }
    .donate-button:hover { background: var(--salvador-blue-hover); transform: scale(1.05); }
    footer { background: var(--bone-white); border-top: 1px solid var(--border-color); text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; }
    @media (max-width: 600px) { .logo { font-size: 2.8rem; } .donation-card { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
  <header>
    <div class="header-content" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
      <img src="/bibliotes/robot-header.png" alt="Personaje Bibliotes" style="width: 85px; height: auto; height: auto; object-fit: contain;">
      <div style="text-align: left;"><div class="logo-container"><a href="/bibliotes/index.html" class="logo">Bibliot<span class="digital-es">es</span></a></div><div class="subtitle" style="margin-top: 4px;">Biblioteca Electrónica El Salvador</div></div>
    </div>
  </header>
  <nav><a href="/bibliotes/index.html">Inicio</a><a href="/bibliotes/biblioteca.html">Biblioteca</a><a href="/bibliotes/generos/">Generos</a></nav>
  <main>
    <section class="donation-card">
      <h1>Apoya el Proyecto</h1>
      <p>Tu apoyo ayuda a mantener Bibliotes disponible, con libros gratuitos y descargas directas para todos.</p>
      <a class="donate-button" href="https://www.paypal.com/donate/" target="_blank" rel="noopener noreferrer">Donar con PayPal</a>
    </section>
  </main>
  <footer><p>&copy; 2026 Bibliotes • Dominio Público y Contenido Abierto</p></footer>
</body>
</html>

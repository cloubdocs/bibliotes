<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letra Q - Bibliotes</title>
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
<header>
  <a href="/" class="logo">Bibliot<span class="digital-es">es</span></a>
</header>

<nav>
  <a href="/">Inicio</a>
  <a href="/biblioteca.html">Biblioteca</a>
  <span>Letra Q</span>
</nav>

<main>
  <section class="alphabet-section">
    <h2 class="alphabet-title" id="titulo-catalogo">Catálogo de libros con Q</h2>
    <p>Próximamente</p>
  </section>
</main>

<footer>
  <p>&copy; 2026 Bibliotes • Dominio Público y Contenido Abierto</p>
</footer>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const total = document.querySelectorAll('.book-card').length;
  const titulo = document.getElementById('titulo-catalogo');
  if (total > 0) titulo.textContent = `Catálogo de libros con Q (${total})`;
});
</script>
</body>
</html>
